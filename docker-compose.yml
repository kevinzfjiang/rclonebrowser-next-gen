services:
  rclonebrowser:
    image: yadiman/rclonebrowser-next-gen:latest
    container_name: rclonebrowser-next
    restart: unless-stopped
    ports:
      - "5800:5800"
    environment:
      # 群晖 DSM 7 的 /volume1/docker 默认开启了 ACL 限制，推荐设为 0:0 (或给 docker 共享文件夹授予 1026 读写权限)
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
      - PORT=5800
      # 可选：将多个挂载点注册为独立下拉存储源（方便在文件管理器下拉框一键直达）
      - LOCAL_MOUNTS=NAS=/media/NAS,NAS2=/media/NAS2,Photos=/media/Photos
      # 可选：设置 Web 登录用户名与密码（留空 APP_PASSWORD 则免密直接进入）
      - APP_USERNAME=admin
      - APP_PASSWORD=
    volumes:
      - /volume1/docker/rclonebrowser/config:/config
      - /volume3/NAS:/media/NAS
      - /volume1/NAS2:/media/NAS2
      - /volume2/homes/kevin/Photos:/media/Photos
    # 如需在容器内使用 rclone mount 挂载，可取消以下注释：
    # cap_add:
    #   - SYS_ADMIN
    # devices:
    #   - /dev/fuse:/dev/fuse:rwm
    # security_opt:
    #   - apparmor:unconfined
