services:
  rclonebrowser:
    image: yadiman/rclonebrowser-next-gen:latest
    container_name: rclonebrowser-next
    restart: unless-stopped
    ports:
      - "5800:5800"
    environment:
      # On Synology DSM 7+, /volume1/docker often has ACL restrictions; 0:0 ensures full read/write access
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
      - PORT=5800
      # Optional: Register multiple local mounts as standalone dropdown items in the Explorer
      - LOCAL_MOUNTS=NAS=/media/NAS,NAS2=/media/NAS2,Photos=/media/Photos
      # Security Note (v2.2+):
      # On first startup, a random initial password is automatically generated and printed in container logs:
      #   docker logs rclonebrowser-next
      # After signing in, you will be prompted to set a new password (stored as a salted scrypt hash in /config/auth.json).
    volumes:
      - /volume1/docker/rclonebrowser/config:/config
      - /volume3/NAS:/media/NAS
      - /volume1/NAS2:/media/NAS2
      - /volume2/homes/kevin/Photos:/media/Photos
    # Uncomment the lines below if you need `rclone mount` inside the container:
    # cap_add:
    #   - SYS_ADMIN
    # devices:
    #   - /dev/fuse:/dev/fuse:rwm
    # security_opt:
    #   - apparmor:unconfined
